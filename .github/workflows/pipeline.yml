name: Full-stack CI-CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test application with MongoDB
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Start full stack for integration test
        run: docker compose -f docker-compose.yml up -d --build --wait --wait-timeout 180

      - name: Check frontend responds
        run: curl --fail http://localhost:8082/

      - name: Submit form data through frontend proxy
        run: |
          response=$(curl --silent --show-error --fail \
            -H 'Content-Type: application/json' \
            -d '{"firstName":"CI Test","email":"ci-test@example.com"}' \
            http://localhost:8082/api/submissions)
          echo "$response"
          echo "$response" | grep -q 'Submission saved.'

      - name: Check MongoDB stored the submission
        run: |
          docker compose -f docker-compose.yml exec -T mongodb \
            mongosh --quiet contact_form \
            --eval 'if (db.submissions.countDocuments({email:"ci-test@example.com"}) !== 1) quit(1)'

      - name: Show service logs if test failed
        if: failure()
        run: docker compose -f docker-compose.yml logs --no-color

      - name: Stop test stack
        if: always()
        run: docker compose -f docker-compose.yml down -v

  publish:
    name: Build and publish images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Sign in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/fullstack-form-frontend:${{ github.sha }}
            ${{ vars.DOCKERHUB_USERNAME }}/fullstack-form-frontend:latest

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/fullstack-form-backend:${{ github.sha }}
            ${{ vars.DOCKERHUB_USERNAME }}/fullstack-form-backend:latest

  deploy:
    name: Deploy to AWS EC2
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: publish
    runs-on: ubuntu-22.04
    steps:
      - name: Prepare deployment directory on EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: mkdir -p ~/fullstack-form

      - name: Copy production Compose file to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: docker-compose.prod.yml
          target: ~/fullstack-form/

      - name: Deploy images to EC2 over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DOCKERHUB_USERNAME,IMAGE_TAG
          script: |
            cd ~/fullstack-form
            export DOCKERHUB_USERNAME IMAGE_TAG
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --wait --remove-orphans
            curl --fail http://localhost/ || exit 1
            docker compose -f docker-compose.prod.yml ps
            docker image prune -f
